# Streamlit 설정
#
# [theme]
#   폰 홈 화면에서 실행했을 때 브라우저 상단 색이 이 값을 따라가서
#   기본 흰색보다 앱처럼 보인다. 색은 포스터/대시보드와 맞췄다.
#
# [client] toolbarMode = "viewer"
#   우측 상단의 개발용 메뉴(Rerun, Settings, Deploy 등)를 숨긴다.
#   시연할 때 불필요한 버튼이 없는 편이 낫다.

[theme]
primaryColor = "#C44E52"           # 불량 다이 색과 동일
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"

[client]
toolbarMode = "viewer"

[server]
# 업로드 기능을 쓰지 않으므로 제한을 낮춰 둔다
maxUploadSize = 5
